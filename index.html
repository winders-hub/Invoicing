<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carpentry">
<title>Carpentry</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#F3EDE2;overflow-x:hidden}
html{background:#1E3B2A}
#app{max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;width:100%}
:root{--pine:#1E3B2A;--cream:#F3EDE2;--paper:#FDFAF5;--amber:#B87A1A;--amberlt:#F5E6C8;--ink:#1A1A1A;--slate:#5A6472;--border:#D8D0C4;--white:#FFFFFF;--err:#B33A2A;--errlt:#FDECEA;--green:#1A6B3C;--greenlt:#D4EDDA}
.topbar{background:var(--pine);color:var(--cream);padding:14px 16px 12px;padding-top:calc(env(safe-area-inset-top, 0px) + 14px);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;gap:12px}
.card{background:var(--paper);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.cbody{padding:14px 16px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;font-family:inherit}
.inp:focus{border-color:var(--pine)}
.lbl{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px;display:block}
.btnp{background:var(--pine);color:var(--cream);border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;width:100%;cursor:pointer;font-family:inherit}
.bsm{border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.back{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;color:var(--cream);font-size:22px;line-height:1;font-weight:300}
.bp{padding:14px 16px 80px}
.day-card{background:var(--paper);border-radius:12px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.dh{padding:9px 14px;display:flex;align-items:center;gap:8px;background:var(--paper)}
.dh.wknd{background:var(--amberlt)}
.dn{font-size:13px;font-weight:700;color:var(--pine);min-width:32px}
.dh.wknd .dn{color:var(--amber)}
.dd{font-size:12px;color:var(--slate);flex:1}
.dhr{font-size:13px;font-weight:700;color:var(--pine)}
.trow{padding:10px 14px;display:flex;gap:8px;align-items:center}
.tinp{flex:1;padding:9px 6px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:14px;color:var(--ink);outline:none;-webkit-appearance:none;text-align:center;font-family:inherit}
.tinp:focus{border-color:var(--pine)}
.tdash{color:var(--slate);font-size:18px;flex-shrink:0}
.ttot{min-width:44px;text-align:right;font-size:14px;font-weight:800;color:var(--pine);font-variant-numeric:tabular-nums;flex-shrink:0}
.raccent{width:3px;background:var(--border);border-radius:2px;align-self:stretch;flex-shrink:0}
.rinp{padding:8px 9px;border-radius:9px;border:1.5px solid var(--border);background:var(--white);font-size:14px;color:var(--ink);outline:none;font-family:inherit;-webkit-appearance:none}
.rinp:focus{border-color:var(--pine)}
.rthumb{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0}
.sumcard{background:var(--paper);border-radius:14px;border:2px solid var(--pine);margin-bottom:12px;overflow:hidden}
.sumrow{display:flex;justify-content:space-between;padding:5px 16px;align-items:baseline}
.sumrow.tot{padding:12px 16px;border-top:1px solid var(--pine)}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:var(--pine);color:var(--cream);padding:9px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.wkcard{background:var(--paper);border-radius:12px;border:2px solid var(--border);margin-bottom:10px;cursor:pointer;overflow:hidden}
.wkcard.sel{border-color:var(--pine)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk.on{background:var(--pine);border-color:var(--pine)}
.invbadge{background:var(--greenlt);color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.stickybot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px;background:var(--paper);border-top:1px solid var(--border);box-sizing:border-box;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.imodal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.imodal img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain}
.imodalx{position:absolute;top:20px;right:20px;color:white;font-size:30px;cursor:pointer;line-height:1}
.empty{text-align:center;padding:60px 20px;color:var(--slate)}
.sep{height:1px;background:var(--border);margin:14px 0}
.notes-area{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:14px;color:var(--ink);outline:none;font-family:inherit;resize:vertical;min-height:80px;line-height:1.5}
.notes-area:focus{border-color:var(--pine)}
.proj-row{display:flex;align-items:center;padding:10px 16px;border-top:1px solid var(--border);cursor:pointer;gap:10px}
.proj-row:active{background:#f0ece4}
.dash-stat{background:var(--paper);border-radius:14px;border:1px solid var(--border);padding:16px;margin-bottom:12px;width:100%}
.dash-num{font-size:28px;font-weight:800;color:var(--pine);font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.dash-sub{font-size:13px;color:var(--slate);margin-top:6px}
.shortcut{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.shortcut:active{background:#f0ece4}
.ytd-toggle{background:none;border:none;width:100%;text-align:left;padding:12px 16px;font-size:13px;font-weight:700;color:var(--pine);cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center}
.gear-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--cream);display:flex;align-items:center}
.arc-card{background:#EDE8DE !important;border-color:#C0B8B0 !important}
.arc-card .proj-row{border-color:#C8C0B4}
.arc-card .proj-row:active{background:#E0D8CC}
.lbr-chk{width:28px;height:28px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:14px;background:var(--white)}
.lbr-chk.on{background:var(--amber);border-color:var(--amber);color:white}
.cat-chip{border:1.5px solid var(--border);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--white);color:var(--slate)}
.cat-chip.sel{background:var(--pine);color:var(--cream);border-color:var(--pine)}
.crd-row{padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const ME={name:"Dennis Winders",line1:"12 Rogers St, Plymouth NH 03264",phone:"(603) 726-6300",venmo:"@Dennis-Winders",zelle:"denniswinders@gmail.com"};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DEFAULT_SYNC_URL="https://script.google.com/macros/s/AKfycbzcdj0ytpXspwHteqU2-o285rqEgjXlsbwSmHoskurNFPEwYaIKCDKNim38hb_FkAA/exec";
const DAN_EMAIL="falby.daniel@gmail.com";
const IRS_RATE=0.70; // 2025 IRS standard mileage rate $/mi — update each Jan
const EXP_CATS=["Tools & Equipment","Vehicle & Travel","Home Office","Materials & Supplies","Insurance","Professional Development","Other"];

const uid=()=>Math.random().toString(36).slice(2,9);
const tod=()=>new Date().toISOString().slice(0,10);
const f$=(n)=>"$"+Number(n||0).toFixed(2);
const esc=(s)=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function wkStart(d){const dt=new Date(d+"T12:00:00"),dy=dt.getDay();return new Date(new Date(d+"T12:00:00").setDate(dt.getDate()-dy+(dy===0?-6:1))).toISOString().slice(0,10);}
function shiftWk(ws,n){const dt=new Date(ws+"T12:00:00");dt.setDate(dt.getDate()+n*7);return dt.toISOString().slice(0,10);}
function wkDays(ws){return Array.from({length:7},(_,i)=>{const dt=new Date(ws+"T12:00:00");dt.setDate(dt.getDate()+i);return dt.toISOString().slice(0,10);});}
function wkLabel(ws){const d=wkDays(ws);return fd(d[0])+" \u2013 "+fd(d[6]);}
const fd=(d)=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fdl=(d)=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
function hrs(i,o){if(!i||!o)return 0;const[h1,m1]=i.split(":").map(Number),[h2,m2]=o.split(":").map(Number),m=(h2*60+m2)-(h1*60+m1);return m>0?+(m/60).toFixed(2):0;}

const sg=(k,fb=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const sgr=(k)=>{try{return localStorage.getItem(k);}catch{return null;}};
const ssr=(k,v)=>{try{localStorage.setItem(k,v);}catch{}};
const sl=(p)=>{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p))ks.push(k);}return ks;};

const LOCAL_ONLY=new Set(["carp-sync-url","carp-last","carp-ytd-open"]);
let syncUrl=localStorage.getItem("carp-sync-url")||DEFAULT_SYNC_URL;
if(!localStorage.getItem("carp-sync-url"))localStorage.setItem("carp-sync-url",DEFAULT_SYNC_URL);

async function bgSync(action,key,value){
  if(!syncUrl||key.startsWith("carp-img-")||LOCAL_ONLY.has(key))return;
  try{await fetch(syncUrl,{method:"POST",redirect:"follow",body:JSON.stringify({action,key,value})});}catch{}
}
async function pullFromSheets(){
  if(!syncUrl)return false;
  try{
    const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(syncUrl+"?action=getAll",{redirect:"follow",signal:ctrl.signal});
    clearTimeout(t);const d=await r.json();
    if(d.ok&&d.data){Object.entries(d.data).forEach(([k,v])=>{if(!k.startsWith("carp-img-")&&!LOCAL_ONLY.has(k)){try{localStorage.setItem(k,v);}catch{}}});return true;}
  }catch(e){if(e.name==="AbortError")console.log("Sync timed out");else console.error("Pull:",e);}
  return false;
}
async function pushToSheets(){
  if(!syncUrl)return false;
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&!k.startsWith("carp-img-")&&!LOCAL_ONLY.has(k))data[k]=localStorage.getItem(k);}
  try{const r=await fetch(syncUrl,{method:"POST",redirect:"follow",body:JSON.stringify({action:"setMany",data})});const d=await r.json();return d.ok;}catch{return false;}
}

function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{} bgSync("set",k,JSON.stringify(v));}
function sd(k){try{localStorage.removeItem(k);}catch{} bgSync("delete",k,null);}

const K={cl:"carp-cl",proj:"carp-proj",wk:(p,w)=>"carp-w-"+p+"__"+w,img:(i)=>"carp-img-"+i,
  invd:(p)=>"carp-invd-"+p,last:"carp-last",ytd:"carp-ytd-open",crd:"carp-crd",exp:"carp-exp",vnd:"carp-vnd",
  gc:"carp-geocache",mc:"carp-mi-cache",vg:"carp-vnd-geo",manmi:"carp-man-mi"};

const getInvd=(pid)=>sg(K.invd(pid),[])||[];
const isInvd=(pid,ws)=>getInvd(pid).includes(ws);
function markInvd(pid,wsArr){ss(K.invd(pid),[...new Set([...getInvd(pid),...wsArr])]);}
function toggleInvd(pid,ws){const c=getInvd(pid);ss(K.invd(pid),c.includes(ws)?c.filter(x=>x!==ws):[...c,ws]);}

function compressImg(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const M=1200;let w=img.width,h=img.height;
    if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",.72));
  };img.src=e.target.result;};r.readAsDataURL(file);
});}

let clients=[],projects=[],nav={screen:"clients"},wd={days:{},notes:""},saveT=null,selWks=new Set();
const getCl=(cid)=>clients.find(c=>c.id===cid)||{};
const getProj=(pid)=>projects.find(p=>p.id===pid)||{};

function migrate(){
  const ep=sg(K.proj,[]),cls=sg(K.cl,[]);
  if(ep.length>0||cls.length===0)return;
  if(!cls.some(c=>c.project))return;
  const np=[];
  cls.forEach(c=>{if(c.project){const pid=uid();np.push({id:pid,clientId:c.id,name:c.project,rate:c.rate,archived:false,createdAt:tod(),lastOpened:null});sl("carp-w-"+c.id+"__").forEach(ok=>{const ws=ok.split("__")[1];ss(K.wk(pid,ws),sg(ok,{days:{},notes:""}));});const oi=sg(K.invd(c.id),[]);if(oi.length>0)ss(K.invd(pid),oi);}});
  ss(K.proj,np);ss(K.cl,cls.map(c=>({id:c.id,name:c.name,address:c.address,rate:c.rate})));
}

let toastT;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2400);}

function go(screen,p={}){nav={screen,...p};render();}
function render(){
  const a=document.getElementById("app");
  switch(nav.screen){
    case"clients":rClients(a);break;
    case"add-cl":rAddCl(a);break;
    case"add-proj":rAddProj(a);break;
    case"week":rWeek(a);break;
    case"list":rList(a);break;
    case"invoice":rInvoice(a);break;
    case"dash":rDash(a);break;
    case"settings":rSettings(a);break;
    case"expenses":rExpenses(a);break;
    case"mileage-detail":rMileageDetail(a);break;
    case"vendor-addresses":rVendorAddresses(a);break;
    case"vendor-addr-search":rVendorAddrSearch(a);break;
    case"add-exp":rAddExp(a);break;
    case"archived-clients":rArchivedClients(a);break;
    case"uninvoiced":rUninvoiced(a);break;
  }
}

const dashBtn=()=>'<button onclick="go(\'dash\')" style="background:none;border:none;cursor:pointer;padding:4px;display:flex;color:var(--cream)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>';
const gearBtn=()=>'<button onclick="go(\'settings\')" class="gear-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>';

function rClients(a){
  const rp=new Set([...projects].sort((a,b)=>(b.lastOpened||"").localeCompare(a.lastOpened||"")).slice(0,3).map(p=>p.id));
  const ac=clients.filter(c=>!c.archived),arc=clients.filter(c=>c.archived);
  const cc=(c)=>{
    const cp=projects.filter(p=>p.clientId===c.id&&!p.archived);
    return '<div class="card'+(c.archived?' arc-card':'')+'"><div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center">'
      +'<div><div style="font-size:15px;font-weight:800;color:var(--ink)">'+esc(c.name)+'</div>'
      +(c.address?'<div style="font-size:11px;color:var(--slate);margin-top:1px">'+esc(c.address)+'</div>':"")
      +'<div style="font-size:11px;color:var(--amber);margin-top:1px;font-weight:600">'+f$(c.rate)+'/hr base rate</div></div>'
      +'<button class="bsm" style="background:var(--paper);color:var(--slate);border:1px solid var(--border);font-size:11px" onclick="go(\'add-cl\',{ex:\''+c.id+'\'})">Edit</button></div>'
      +(cp.length>0?cp.map(p=>'<div class="proj-row" onclick="openProj(\''+p.id+'\')">'
        +'<div style="width:7px;height:7px;border-radius:50%;background:'+(rp.has(p.id)?'var(--green)':'var(--border)')+';flex-shrink:0"></div>'
        +'<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;color:var(--ink)">'+esc(p.name)+'</div>'
        +(p.rate!==c.rate?'<div style="font-size:11px;color:var(--amber)">'+f$(p.rate)+'/hr</div>':"")+'</div>'
        +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>'
        +'<button onclick="event.stopPropagation();go(\'add-proj\',{ex:\''+p.id+'\',cid:\''+c.id+'\'})" style="background:none;border:none;color:var(--slate);cursor:pointer;padding:2px 6px;font-size:12px">&#x22EE;</button>'
        +'</div>').join(""):'<div style="padding:10px 16px;font-size:13px;color:var(--slate);border-top:1px solid var(--border)">No active projects</div>')
      +'<div style="padding:8px 16px;border-top:1px solid var(--border)"><button class="bsm" style="background:var(--amberlt);color:var(--amber);font-size:12px;padding:6px 12px" onclick="go(\'add-proj\',{ex:null,cid:\''+c.id+'\'})">+ Add Project</button></div></div>';
  };
  a.innerHTML='<div class="topbar">'+dashBtn()
    +'<div style="flex:1"><div style="font-size:19px;font-weight:800">&#x1F528; Carpentry</div>'
    +'<div style="font-size:11px;color:#9BBFA9;text-transform:uppercase;letter-spacing:.4px;margin-top:1px">Dennis Winders</div></div>'
    +'<button class="bsm" style="background:var(--amber);color:white;font-size:22px;padding:3px 11px;font-weight:300" onclick="go(\'add-cl\',{ex:null})">+</button></div>'
    +'<div class="bp">'
    +'<button onclick="go(\'expenses\')" style="background:var(--paper);border:1.5px solid var(--border);border-radius:12px;padding:11px 16px;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:14px;font-family:inherit">'
    +'<span style="font-size:18px">&#x1F9FE;</span><span style="font-size:14px;font-weight:700;color:var(--ink)">My Business Expenses</span>'
    +'<svg style="margin-left:auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>'
    +(ac.length===0&&arc.length===0?'<div class="empty"><div style="font-size:40px;margin-bottom:12px">&#x1F4C1;</div><div style="font-weight:700;margin-bottom:6px">No clients yet</div><div style="font-size:13px">Tap + to create your first client</div></div>':ac.map(cc).join(""))
    +(arc.length>0?'<button onclick="go(\'archived-clients\')" style="background:var(--paper);border:1.5px solid var(--border);border-radius:12px;padding:11px 16px;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;margin-top:4px;font-family:inherit"><span style="font-size:18px">&#x1F4E6;</span><span style="font-size:14px;font-weight:700;color:var(--ink)">Archived Clients</span><span style="font-size:12px;color:var(--slate);margin-left:2px">('+arc.length+')</span><svg style="margin-left:auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>':"")

async function pickImg(d,i){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.style.cssText="position:fixed;top:-100px;left:-100px;opacity:0";
  document.body.appendChild(inp);
  inp.onchange=async(e)=>{
    document.body.removeChild(inp);

    const comp=await compressImg(f);const key=K.img(uid());ssr(key,comp);

function timeOpts(sel){

  for(let h=5;h<=21;h++){

      o+='<option value="'+v+'"'+(v===sel?' selected':'')+'>'+l+'</option>';

function togWk(ws){
  selWks.has(ws)?selWks.delete(ws):selWks.add(ws);
  const cb=document.getElementById("cb-"+ws),card=document.getElementById("wc-"+ws);
  if(cb){cb.classList.toggle("on",selWks.has(ws));cb.innerHTML=selWks.has(ws)?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>':"";}
  if(card)card.classList.toggle("sel",selWks.has(ws));
  const bar=document.getElementById("ibar"),cnt=document.getElementById("scount");
  if(bar)bar.style.display=selWks.size>0?"block":"none";
  if(cnt)cnt.textContent=selWks.size;
}
function genInvn(){
  const yr=new Date().getFullYear().toString().slice(2);
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no I/O/0/1
  let r='';for(let i=0;i<4;i++)r+=chars[Math.floor(Math.random()*chars.length)];
  return'INV-'+yr+'-'+r;
}
function genInv(){
  if(selWks.size===0)return;
  const ws=[...selWks];
  markInvd(nav.proj.id,ws);
  // Calculate prepaid credit
  const prepaidTotal=nav.proj.prepaidHours||0;
  const prepaidInvoiced=nav.proj.prepaidInvoiced||0;
  const prepaidRemaining=Math.max(0,prepaidTotal-prepaidInvoiced);
  let thisInvHours=0;
  ws.forEach(w=>{
    const data=sg(K.wk(nav.proj.id,w),{days:{},notes:""});
    if(data.lumpSum)thisInvHours+=data.lumpSum.hours||0;
    else Object.values(data.days||{}).forEach(d=>thisInvHours+=hrs(d.timeIn,d.timeOut));
  });
  thisInvHours=+thisInvHours.toFixed(2);
  const creditHours=+Math.min(prepaidRemaining,thisInvHours).toFixed(2);
  const creditAmt=+(creditHours*(nav.proj.rate||45)).toFixed(2);
  const prepaidCredit={hours:creditHours,amount:creditAmt};
  if(creditHours>0){
    const newInvoiced=+(prepaidInvoiced+creditHours).toFixed(2);
    projects=projects.map(p=>p.id===nav.proj.id?{...p,prepaidInvoiced:newInvoiced}:p);
    ss(K.proj,projects);nav.proj={...nav.proj,prepaidInvoiced:newInvoiced};
  }
  // Card charges
  let famAmt=0,lbrAmt=0;
  ws.forEach(w=>{
    const data=sg(K.wk(nav.proj.id,w),{days:{},notes:""});
    Object.values(data.days||{}).forEach(d=>{(d.receipts||[]).forEach(r=>{const a=parseFloat(r.amount||0);if(r.account==="lumber")lbrAmt+=a;else famAmt+=a;});});
    if(data.lumpSum)famAmt+=parseFloat(data.lumpSum.materials||0);
  });
  famAmt=+famAmt.toFixed(2);lbrAmt=+lbrAmt.toFixed(2);
  if(famAmt>0||lbrAmt>0){
    const cl=getCl(nav.proj.clientId),invDate=tod(),invn=genInvn();
    ss(K.crd,[...(sg(K.crd,[])||[]),{id:uid(),invn,invDate,clientName:cl.name||"",projName:nav.proj.name,famAmt,lbrAmt,famPaid:false,lbrPaid:false}]);
  }
  go("invoice",{proj:nav.proj,wks:ws,invn:genInvn(),prepaidCredit});
}

function buildInvData(){
  const sws=[...nav.wks].sort(),cl=getCl(nav.proj.clientId),rate=nav.proj.rate||45;
  const wdata=sws.map(ws=>({ws,data:sg(K.wk(nav.proj.id,ws),{days:{},notes:""})}));
  const allDays=[],lumpWks=[],notesArr=[];
  wdata.forEach(({ws,data})=>{
    if(data.notes)notesArr.push(data.notes);
    if(data.lumpSum&&(data.lumpSum.hours>0||data.lumpSum.materials>0))lumpWks.push({ws,...data.lumpSum});
    else Object.entries(data.days||{}).forEach(([date,day])=>{
      const h=hrs(day.timeIn,day.timeOut),recs=(day.receipts||[]).filter(r=>r.vendor||r.amount||r.imgKey);
      if(h>0||recs.length>0)allDays.push({date,timeIn:day.timeIn,timeOut:day.timeOut,h,recs});
    });
  });
  allDays.sort((a,b)=>a.date.localeCompare(b.date));
  const labDays=allDays.filter(d=>d.h>0);
  const th=+labDays.reduce((s,d)=>s+d.h,0).toFixed(2),lab=+(th*rate).toFixed(2);
  const lumpHrs=+lumpWks.reduce((s,w)=>s+(w.hours||0),0).toFixed(2),lumpLab=+(lumpHrs*rate).toFixed(2);
  const lumpMat=+lumpWks.reduce((s,w)=>s+(w.materials||0),0).toFixed(2);
  const allR=allDays.flatMap(d=>d.recs.map(r=>({...r,date:d.date})));
  const dayMat=+allR.reduce((s,r)=>s+parseFloat(r.amount||0),0).toFixed(2);
  const mat=+(dayMat+lumpMat).toFixed(2),laborTotal=+(lab+lumpLab).toFixed(2),tot=+(laborTotal+mat).toFixed(2);
  const allDates=[...allDays.map(d=>d.date),...lumpWks.map(w=>w.ws)].sort();
  const dr=allDates.length===0?"":allDates.length===1?fd(allDates[0]):fd(allDates[0])+" \u2013 "+fd(allDates[allDates.length-1]);
  if(!nav.invn)nav.invn=genInvn();const invn=nav.invn;
  const prepaidCredit=nav.prepaidCredit||{hours:0,amount:0};
  const amtDue=+Math.max(0,laborTotal+mat-prepaidCredit.amount).toFixed(2);
  return{allDays,labDays,th,lab,lumpWks,lumpHrs,lumpLab,lumpMat,allR,dayMat,mat,laborTotal,tot,dr,invn,notesStr:notesArr.filter(Boolean).join("\n\n"),rate,cl,prepaidCredit,amtDue};
}

function calcDash(){
  const now=new Date(),ago30=new Date(now-30*864e5).toISOString().slice(0,10),ytdStart=now.getFullYear()+'-01-01';
  let h30=0,lab30=0,mat30=0,uninv=0,uninvProjs=new Set(),ytdLab=0,ytdMat=0;
  projects.forEach(p=>{
    const keys=sl("carp-w-"+p.id+"__"),invdSet=new Set(getInvd(p.id)),rate=p.rate||45;
    keys.forEach(k=>{
      const ws=k.split("__")[1],data=sg(k,{days:{},notes:""});
      let wh=0,wm=0;
      if(data.lumpSum){wh=+(data.lumpSum.hours||0);wm=+(data.lumpSum.materials||0);}
      else Object.values(data.days||{}).forEach(d=>{wh+=hrs(d.timeIn,d.timeOut);(d.receipts||[]).forEach(r=>wm+=parseFloat(r.amount||0));});
      wh=+wh.toFixed(2);wm=+wm.toFixed(2);const wLab=+(wh*rate).toFixed(2);
      if(ws>=ago30){h30+=wh;lab30+=wLab;mat30+=wm;}
      if(ws>=ytdStart){ytdLab+=wLab;ytdMat+=wm;}
      if(!p.archived&&!getCl(p.clientId).archived&&!invdSet.has(ws)&&(wh>0||wm>0)){uninv+=wLab+wm;uninvProjs.add(p.id);}
    });
  });
  return{h30:+h30.toFixed(2),lab30:+lab30.toFixed(2),mat30:+mat30.toFixed(2),tot30:+(lab30+mat30).toFixed(2),uninv:+uninv.toFixed(2),uninvProjCount:uninvProjs.size,ytdLab:+ytdLab.toFixed(2),ytdMat:+ytdMat.toFixed(2),ytdTot:+(ytdLab+ytdMat).toFixed(2)};
}

function rUninvoiced(a){
  const items=[];

    if(p.archived||getCl(p.clientId).archived)return;
    const invdSet=new Set(getInvd(p.id)),rate=p.rate||45,cl=getCl(p.clientId);
    const uninvWks=[];
    sl("carp-w-"+p.id+"__").forEach(k=>{
      const ws=k.split("__")[1];if(invdSet.has(ws))return;
      const data=sg(k,{days:{},notes:""});
      let wh=0,wm=0;
      if(data.lumpSum){wh=+(data.lumpSum.hours||0);wm=+(data.lumpSum.materials||0);}
      else Object.values(data.days||{}).forEach(d=>{wh+=hrs(d.timeIn,d.timeOut);(d.receipts||[]).forEach(r=>wm+=parseFloat(r.amount||0));});
      wh=+wh.toFixed(2);wm=+wm.toFixed(2);
      if(wh>0||wm>0)uninvWks.push({ws,wh,wm,wLab:+(wh*rate).toFixed(2),wTot:+(wh*rate+wm).toFixed(2),isLump:!!data.lumpSum});
    });
    if(uninvWks.length>0){
      uninvWks.sort((a,b)=>b.ws.localeCompare(a.ws));
      items.push({p,cl,uninvWks,projTotal:+uninvWks.reduce((s,w)=>s+w.wTot,0).toFixed(2)});
    }

  items.sort((a,b)=>b.projTotal-a.projTotal);
  const grandTotal=+items.reduce((s,i)=>s+i.projTotal,0).toFixed(2);

  let html='<div class="topbar"><button class="back" onclick="go(\'dash\')">&#8249;</button>'
    +'<div style="flex:1"><div style="font-size:16px;font-weight:800">Uninvoiced Work</div>'

        +'<div class="card">';

          +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:13px;font-weight:700;color:var(--ink)">'+wkLabel(w.ws)+(w.isLump?' <span style="font-size:10px;background:var(--amberlt);color:var(--amber);border-radius:4px;padding:1px 5px">SUMMARY</span>':'')+'</div>'
          +'<div style="font-size:12px;color:var(--slate);margin-top:2px">'+(w.wh>0?w.wh+'h @ '+f$(p.rate||45)+'/hr':'')+(w.wh>0&&w.wm>0?' &middot; ':'')+(w.wm>0?f$(w.wm)+' materials':'')+'</div>'

// ── Mileage engine ──────────────────────────────────────────────────────────
async function nominatim(q){
  await new Promise(r=>setTimeout(r,220));
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q),{headers:{'User-Agent':'CarpentryApp/1.0'}});
    const d=await r.json();
    if(d&&d.length)return{lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};
  }catch(e){console.log('Nominatim:',e);}
  return null;
}
async function getCoords(addr){
  const cache=sg(K.gc,{})||{},key=addr.toLowerCase().trim();
  if(cache[key])return cache[key];
  const c=await nominatim(addr);
  if(c){const nc={...sg(K.gc,{})||{}};nc[key]=c;ss(K.gc,nc);}
  return c;
}
async function getRoundTripMiles(destAddr){
  if(!destAddr||!destAddr.trim())return null;
  const dq=(destAddr.toUpperCase().includes(' NH')||destAddr.toUpperCase().includes('NEW HAMPSHIRE'))?destAddr:destAddr+', NH';
  const cache=sg(K.mc,{})||{},key=dq.toLowerCase().trim();
  if(key in cache)return cache[key];
  const home=await getCoords(ME.line1);
  const dest=await getCoords(dq);
  const nc={...sg(K.mc,{})||{}};
  if(!home||!dest){nc[key]=null;ss(K.mc,nc);return null;}
  try{
    const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+home.lng+','+home.lat+';'+dest.lng+','+dest.lat+'?overview=false');
    const d=await r.json();
    if(d.code==='Ok'){const mi=+(d.routes[0].distance/1609.34*2).toFixed(1);nc[key]=mi;ss(K.mc,nc);return mi;}
  }catch(e){console.log('OSRM:',e);}
  nc[key]=null;ss(K.mc,nc);return null;
}

  const cl=getCl(nav.proj.clientId);

  let mi=0;
  projects.forEach(p=>{
    sl('carp-w-'+p.id+'__').forEach(k=>{
      if(k.split('__')[1]<ytdStart)return;
      const data=sg(k,{days:{},notes:''});
      Object.values(data.days||{}).forEach(d=>{
        if(d.miles)mi+=d.miles;
        (d.receipts||[]).forEach(r=>{if(r.miles)mi+=r.miles;});

    });

async function scanHistoricalMileage(){
  toast('Scanning\u2026');
  let dc=0,rc=0;const cliMi={};
  for(const p of projects){
    if(!(p.clientId in cliMi)){
      const cl=getCl(p.clientId);
      cliMi[p.clientId]=cl.address?await getRoundTripMiles(cl.address):null;
    }
    const cmi=cliMi[p.clientId];
    for(const k of sl('carp-w-'+p.id+'__')){
      const data=sg(k,{days:{},notes:''});let chg=false;
      for(const[,day] of Object.entries(data.days||{})){
        if(day.timeIn&&day.miles===undefined&&cmi!==null){day.miles=cmi;chg=true;dc++;}
        for(const rec of(day.receipts||[])){
          if(rec.vendor&&rec.miles===undefined){
            const vg=sg(K.vg,{})||{},vk=rec.vendor.toLowerCase().trim();
            if(vg[vk]?.mi!==undefined){rec.miles=vg[vk].mi;chg=true;rc++;}
            else if(vg[vk]?.status!=='not-found'){
              const mi=await getRoundTripMiles(rec.vendor.trim());
              const nvg=sg(K.vg,{})||{};
              if(mi!==null){nvg[vk]={status:'found',mi};ss(K.vg,nvg);rec.miles=mi;chg=true;rc++;}
              else{nvg[vk]={status:'not-found'};ss(K.vg,nvg);}
              await new Promise(r=>setTimeout(r,300));
            }
          }
        }
      }
      if(chg)ss(k,data);
    }
  }
  toast('Done \u2014 '+dc+' work days, '+rc+' receipts updated');
}

function haversineKm(lat1,lon1,lat2,lon2){
  const R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return +(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(1);
}
async function getRoundTripMilesCoords(destLat,destLng){
  const home=await getCoords(ME.line1);if(!home)return null;
  try{
    const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+home.lng+','+home.lat+';'+destLng+','+destLat+'?overview=false');
    const d=await r.json();
    if(d.code==='Ok')return+(d.routes[0].distance/1609.34*2).toFixed(1);
  }catch(e){console.log('OSRM:',e);}
  return null;
}
function backfillVendorMiles(vkey,mi){
  let count=0;
  projects.forEach(p=>{
    sl('carp-w-'+p.id+'__').forEach(k=>{
      const data=sg(k,{days:{},notes:''});let chg=false;
      Object.values(data.days||{}).forEach(day=>{
        (day.receipts||[]).forEach(rec=>{
          if(rec.vendor&&rec.vendor.toLowerCase().trim()===vkey){rec.miles=mi;chg=true;count++;}
        });
      });
      if(chg)ss(k,data);
    });
  });
  return count;
}

function getVendorAppearances(){
  const map={};
  projects.forEach(p=>{
    const cl=getCl(p.clientId);
    sl('carp-w-'+p.id+'__').forEach(k=>{
      const ws=k.split('__')[1];
      const data=sg(k,{days:{},notes:''});
      Object.entries(data.days||{}).forEach(([date,day])=>{
        (day.receipts||[]).forEach(rec=>{
          if(!rec.vendor)return;
          const vkey=rec.vendor.toLowerCase().trim();
          if(!map[vkey])map[vkey]=[];
          map[vkey].push({projId:p.id,projName:p.name,clientName:cl.name||'',ws,date,amount:rec.amount||''});
        });
      });
    });
  });
  return map;
}

    +'<div><label class="lbl">Number of days worked</label><input class="inp" id="mm-days" type="number" inputmode="decimal" min="0.5" step="0.5" placeholder="e.g. 12"></div>'
    +'<button class="btnp" onclick="saveManualMiles()">Save Miles</button>'
    +'</div></div></div>';
}
async function saveSyncUrl(){
  const url=document.getElementById("surl").value.trim();syncUrl=url;localStorage.setItem("carp-sync-url",url);toast("Testing connection...");
  try{const r=await fetch(url+"?action=getAll",{redirect:"follow"});const d=await r.json();toast(d.ok?"Connected \u2713":"Error \u2014 check script");}catch{toast("Connection failed \u2014 check URL");}
}
async function pushAll(){toast("Pushing to Sheets...");const ok=await pushToSheets();toast(ok?"All data pushed \u2713":"Push failed \u2014 check URL");}
async function pullAll(){
  if(!confirm("This will overwrite your local data with whatever is in Google Sheets. Continue?"))return;
  toast("Pulling from Sheets...");
  const ok=await pullFromSheets();
  if(ok){clients=sg(K.cl,[])||[];projects=sg(K.proj,[])||[];toast("Data restored \u2713");go("clients");}
  else toast("Pull failed \u2014 check URL");
}

async function boot(){
  migrate();
  clients=sg(K.cl,[])||[];projects=sg(K.proj,[])||[];
  const last=sg(K.last,null);
  if(last){
    const sevenAgo=new Date(Date.now()-7*864e5).toISOString();
    const p=projects.find(x=>x.id===last.projectId&&!x.archived);
    if(p&&last.ts&&last.ts>sevenAgo){wd=sg(K.wk(p.id,wkStart(tod())),{days:{},notes:""});go("week",{proj:p,ws:wkStart(tod())});return;}
  }
  go("clients");
}
window.addEventListener("online",async()=>{toast("Back online \u2014 pushing...");await pushToSheets();toast("Synced \u2713");});
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/Invoicing/sw.js")
    .then(reg=>reg.update())
    .catch(e=>console.log("SW:",e));
}
boot();
</script>
